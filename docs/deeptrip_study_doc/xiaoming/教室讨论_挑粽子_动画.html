<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教室里的小讨论 · 怎么帮奶奶挑粽子</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #2d3436;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  /* ========== 教室整体场景 ========== */
  .classroom {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(180deg, #b8d8f0 0%, #d4e8f5 60%, #c9a989 60%, #b89876 100%);
    overflow: hidden;
  }

  /* ===== 黑板 ===== */
  .blackboard {
    position: absolute;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: 480px;
    height: 200px;
    background: linear-gradient(135deg, #2d5a3d, #1e3d28);
    border: 12px solid #8b6f47;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    padding: 20px;
    color: #fff;
    z-index: 1;
  }
  .blackboard .chalk-title {
    text-align: center;
    font-size: 26px;
    font-family: "Kaiti SC", "STKaiti", cursive;
    letter-spacing: 6px;
    margin-bottom: 14px;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.3);
  }
  .blackboard .chalk-content {
    font-family: "Kaiti SC", "STKaiti", cursive;
    font-size: 17px;
    line-height: 2;
    padding-left: 20px;
    opacity: 0.9;
  }
  .blackboard .chalk-item {
    opacity: 0;
    transform: translateX(-20px);
    transition: opacity 0.6s, transform 0.6s;
  }
  .blackboard .chalk-item.show {
    opacity: 0.9;
    transform: translateX(0);
  }
  .blackboard .chalk-item .check {
    display: inline-block;
    width: 18px;
    color: #ffd700;
    margin-right: 6px;
  }

  /* 黑板擦 + 粉笔 */
  .blackboard-tools {
    position: absolute;
    bottom: -8px;
    right: 20px;
    display: flex;
    gap: 8px;
  }
  .chalk {
    width: 30px;
    height: 8px;
    background: #fff;
    border-radius: 2px;
  }
  .eraser {
    width: 50px;
    height: 16px;
    background: linear-gradient(180deg, #ffeb3b 50%, #f57f17 50%);
    border-radius: 3px;
  }

  /* ===== 窗户 ===== */
  .window {
    position: absolute;
    top: 12%;
    width: 140px;
    height: 180px;
    background: linear-gradient(135deg, #87ceeb, #b3d9ff);
    border: 8px solid #fff;
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    overflow: hidden;
  }
  .window::before, .window::after {
    content: "";
    position: absolute;
    background: #fff;
  }
  .window::before {
    width: 4px;
    height: 100%;
    left: 50%;
    transform: translateX(-50%);
  }
  .window::after {
    height: 4px;
    width: 100%;
    top: 50%;
    transform: translateY(-50%);
  }
  .window.left { left: 4%; }
  .window.right { right: 4%; }
  .cloud {
    position: absolute;
    width: 50px;
    height: 18px;
    background: #fff;
    border-radius: 18px;
    top: 30px;
    left: -50px;
    animation: cloudMove 20s linear infinite;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #fff;
    border-radius: 50%;
  }
  .cloud::before {
    width: 24px; height: 24px;
    top: -10px; left: 8px;
  }
  .cloud::after {
    width: 20px; height: 20px;
    top: -8px; right: 8px;
  }
  .window.right .cloud { animation-delay: -10s; top: 60px; }
  @keyframes cloudMove {
    from { left: -50px; }
    to { left: 130px; }
  }
  .sun {
    position: absolute;
    width: 30px; height: 30px;
    background: radial-gradient(circle, #ffeb3b, #ffa726);
    border-radius: 50%;
    top: 14px;
    right: 14px;
    box-shadow: 0 0 20px rgba(255,235,59,0.6);
  }

  /* ===== 教室海报 ===== */
  .poster {
    position: absolute;
    bottom: 45%;
    width: 90px;
    height: 110px;
    background: #fff;
    border: 4px solid #ff6b6b;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8px;
    transform: rotate(-3deg);
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .poster.left { left: 18%; }
  .poster.right { right: 18%; transform: rotate(3deg); border-color: #74b9ff; }
  .poster .pic { font-size: 38px; }
  .poster .txt { font-size: 11px; color: #2d3436; font-weight: bold; margin-top: 4px; }

  /* ===== 课桌 ===== */
  .desk {
    position: absolute;
    bottom: 5%;
    width: 220px;
    height: 100px;
  }
  .desk-top {
    width: 100%;
    height: 16px;
    background: linear-gradient(180deg, #8b6f47, #6b5034);
    border-radius: 4px;
    box-shadow: 0 4px 0 #5a4129;
  }
  .desk-leg {
    position: absolute;
    width: 12px;
    height: 80px;
    background: #6b5034;
    bottom: -80px;
  }
  .desk-leg.l { left: 16px; }
  .desk-leg.r { right: 16px; }
  .desk-book {
    position: absolute;
    top: -22px;
    width: 50px;
    height: 32px;
    border-radius: 3px;
  }
  .desk-book.b1 {
    left: 20px;
    background: linear-gradient(135deg, #74b9ff, #0984e3);
  }
  .desk-book.b2 {
    right: 30px;
    background: linear-gradient(135deg, #ff7675, #d63031);
    transform: rotate(8deg);
  }
  .desk.left { left: 8%; }
  .desk.right { right: 8%; }

  /* ========== 小朋友卡通形象（Q版优化） ========== */
  .kid {
    position: absolute;
    bottom: 8%;
    width: 180px;
    height: 280px;
    z-index: 5;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .kid.left { left: 10%; }
  .kid.right { right: 10%; }
  .kid.speaking {
    transform: translateY(-8px);
    z-index: 10;
  }
  .kid.speaking .head {
    animation: nod 0.6s ease infinite alternate;
  }
  @keyframes nod {
    from { transform: rotate(-3deg); }
    to { transform: rotate(3deg); }
  }

  /* ===== 头部（大头娃娃） ===== */
  .kid .head {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto;
    z-index: 3;
    transform-origin: bottom center;
    transition: transform 0.3s;
  }
  .kid .face {
    position: absolute;
    inset: 10px 5px 0 5px;
    background: radial-gradient(circle at 30% 30%, #ffe4cc, #fdc795);
    border-radius: 50% 50% 45% 45%;
    border: 3px solid #3d2817;
    z-index: 2;
  }
  /* 耳朵 */
  .kid .ear {
    position: absolute;
    width: 16px;
    height: 22px;
    background: #fdc795;
    border: 3px solid #3d2817;
    border-radius: 50%;
    top: 55px;
    z-index: 1;
  }
  .kid .ear.l { left: -2px; }
  .kid .ear.r { right: -2px; }

  /* ===== 男孩头发（蓬松短发+刘海） ===== */
  .kid.boy .hair-back {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: #2d2418;
    border-radius: 50% 50% 30% 30%;
    z-index: 1;
  }
  .kid.boy .hair-front {
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    height: 50px;
    background: #2d2418;
    border-radius: 50% 50% 40% 40%;
    z-index: 4;
    box-shadow: inset -8px -4px 0 rgba(255,255,255,0.1);
  }
  .kid.boy .hair-front::before {
    /* 一缕翘起的呆毛 */
    content: "";
    position: absolute;
    top: -10px;
    left: 45%;
    width: 14px;
    height: 18px;
    background: #2d2418;
    border-radius: 50% 50% 30% 30%;
    transform: rotate(-15deg);
  }
  .kid.boy .hair-front::after {
    /* 刘海碎发 */
    content: "";
    position: absolute;
    bottom: -8px;
    right: 20px;
    width: 22px;
    height: 16px;
    background: #2d2418;
    border-radius: 0 50% 50% 50%;
    transform: rotate(20deg);
  }

  /* ===== 女孩头发（波波头 + 头顶大蝴蝶结） ===== */
  .kid.girl .hair-back {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 100px;
    background: #4a2c1a;
    border-radius: 50% 50% 30% 30% / 60% 60% 20% 20%;
    z-index: 1;
  }
  .kid.girl .hair-front {
    position: absolute;
    top: 8px;
    left: 5px;
    right: 5px;
    height: 55px;
    background: #4a2c1a;
    border-radius: 50% 50% 40% 40%;
    z-index: 4;
    box-shadow: inset -8px -4px 0 rgba(255,255,255,0.08);
  }
  .kid.girl .hair-front::before {
    /* 斜刘海 */
    content: "";
    position: absolute;
    bottom: -8px;
    left: 12px;
    width: 55px;
    height: 16px;
    background: #4a2c1a;
    border-radius: 0 60% 50% 50%;
    transform: rotate(-6deg);
  }
  .kid.girl .hair-front::after {
    /* 右侧碎发 */
    content: "";
    position: absolute;
    bottom: -4px;
    right: 8px;
    width: 28px;
    height: 14px;
    background: #4a2c1a;
    border-radius: 50% 0 50% 50%;
    transform: rotate(15deg);
  }
  /* 两侧鬓发（贴脸） */
  .kid.girl .pigtail {
    position: absolute;
    width: 18px;
    height: 50px;
    background: linear-gradient(180deg, #4a2c1a, #3d2417);
    border: 2px solid #2d1810;
    border-radius: 30% 30% 50% 50%;
    top: 45px;
    z-index: 0;
  }
  .kid.girl .pigtail.l {
    left: 2px;
    transform: rotate(-8deg);
  }
  .kid.girl .pigtail.r {
    right: 2px;
    transform: rotate(8deg);
  }
  /* 头顶大蝴蝶结 */
  .kid.girl .ribbon {
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 22px;
    z-index: 5;
    pointer-events: none;
  }
  .kid.girl .ribbon.l { display: none; }
  .kid.girl .ribbon.r {
    /* 复用 .ribbon.r 作为蝴蝶结中心结点 */
    width: 12px;
    height: 14px;
    background: linear-gradient(135deg, #c0392b, #8b0000);
    border: 2px solid #6a0000;
    border-radius: 3px;
    top: 0;
    z-index: 7;
  }
  .kid.girl .ribbon::before, .kid.girl .ribbon::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 18px;
    background: linear-gradient(135deg, #ff4757, #c0392b);
    border: 2px solid #8b0000;
    top: 2px;
  }
  .kid.girl .ribbon::before {
    left: 0;
    border-radius: 60% 30% 60% 30%;
    transform: rotate(-15deg);
  }
  .kid.girl .ribbon::after {
    right: 0;
    border-radius: 30% 60% 30% 60%;
    transform: rotate(15deg);
  }

  /* ===== 眉毛 ===== */
  .kid .brow {
    position: absolute;
    width: 18px;
    height: 5px;
    background: #2d2418;
    border-radius: 20px;
    top: 50px;
    z-index: 6;
  }
  .kid .brow.l { left: 28px; transform: rotate(-5deg); }
  .kid .brow.r { right: 28px; transform: rotate(5deg); }
  .kid.speaking .brow.l { transform: rotate(-12deg); }
  .kid.speaking .brow.r { transform: rotate(12deg); }

  /* ===== 眼睛（大眼睛 + 亮闪闪高光） ===== */
  .kid .eyes {
    position: absolute;
    top: 60px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 24px;
    z-index: 6;
  }
  .kid .eye {
    position: relative;
    width: 22px;
    height: 26px;
    background: #fff;
    border: 3px solid #2d2418;
    border-radius: 50%;
    overflow: hidden;
  }
  .kid .eye .pupil {
    position: absolute;
    width: 14px;
    height: 18px;
    background: radial-gradient(circle at 35% 35%, #5b3d2b, #2d1810);
    border-radius: 50%;
    bottom: 1px;
    left: 50%;
    transform: translateX(-50%);
  }
  .kid .eye .pupil::before {
    /* 大高光 */
    content: "";
    position: absolute;
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    top: 3px;
    left: 2px;
  }
  .kid .eye .pupil::after {
    /* 小高光 */
    content: "";
    position: absolute;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    bottom: 4px;
    right: 3px;
  }
  /* 眨眼动画——眼皮盖下来 */
  .kid.blink .eye::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 0;
    background: #fdc795;
    z-index: 3;
    animation: blinkLid 5s ease infinite;
  }
  @keyframes blinkLid {
    0%, 92%, 100% { height: 0; top: 0; }
    95%, 97% { height: 100%; top: 0; }
  }

  /* ===== 腮红 ===== */
  .kid .cheek {
    position: absolute;
    top: 90px;
    width: 18px;
    height: 10px;
    background: radial-gradient(circle, #ff9aa2, transparent 70%);
    border-radius: 50%;
    z-index: 5;
  }
  .kid .cheek.l { left: 14px; }
  .kid .cheek.r { right: 14px; }

  /* ===== 嘴巴 ===== */
  .kid .mouth {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 10px;
    border: 2.5px solid #2d2418;
    border-top: 0;
    border-radius: 0 0 22px 22px;
    background: #ee5253;
    z-index: 6;
    transition: all 0.2s;
    overflow: hidden;
  }
  .kid .mouth::after {
    /* 小舌头 */
    content: "";
    position: absolute;
    width: 14px;
    height: 6px;
    background: #ff7675;
    border-radius: 50%;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
  }
  .kid.speaking .mouth {
    animation: talk 0.25s ease infinite alternate;
  }
  @keyframes talk {
    0% { height: 8px; width: 22px; border-radius: 0 0 22px 22px; }
    50% { height: 16px; width: 18px; border-radius: 50%; }
    100% { height: 10px; width: 20px; border-radius: 0 0 22px 22px; }
  }

  /* ===== 脖子 ===== */
  .kid .neck {
    position: relative;
    width: 32px;
    height: 14px;
    background: #fdc795;
    border: 3px solid #3d2817;
    border-top: 0;
    margin: -6px auto 0;
    z-index: 1;
    border-radius: 0 0 8px 8px;
  }

  /* ===== 身体（校服） ===== */
  .kid .body {
    position: relative;
    width: 120px;
    height: 110px;
    margin: -2px auto 0;
    border: 3px solid #2d2418;
    border-radius: 20px 20px 14px 14px;
    z-index: 2;
    overflow: visible;
  }
  .kid.boy .body {
    background: linear-gradient(180deg, #6ab7ff 0%, #3a7bd5 100%);
  }
  .kid.girl .body {
    background: linear-gradient(180deg, #ff9eb5 0%, #ee5276 100%);
  }
  /* 校服领子（白色） */
  .kid .collar-l, .kid .collar-r {
    position: absolute;
    top: -2px;
    width: 0; height: 0;
    border-style: solid;
    z-index: 3;
  }
  .kid .collar-l {
    left: 28px;
    border-width: 20px 14px 0 0;
    border-color: #fff transparent transparent transparent;
    filter: drop-shadow(-1px 1px 0 #2d2418);
  }
  .kid .collar-r {
    right: 28px;
    border-width: 20px 0 0 14px;
    border-color: #fff transparent transparent transparent;
    filter: drop-shadow(1px 1px 0 #2d2418);
  }
  /* 红领巾 */
  .kid .scarf-knot {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 12px;
    background: linear-gradient(135deg, #ff4757, #c0392b);
    border: 2px solid #8b0000;
    border-radius: 4px;
    z-index: 5;
  }
  .kid .scarf-tail {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 24px solid transparent;
    border-right: 24px solid transparent;
    border-top: 36px solid #ff4757;
    z-index: 4;
    filter: drop-shadow(0 2px 0 #8b0000);
  }
  /* 校服按钮 */
  .kid .button {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 6px;
    background: #fff;
    border: 1.5px solid #2d2418;
    border-radius: 50%;
    z-index: 3;
  }
  .kid .button.b1 { top: 55px; }
  .kid .button.b2 { top: 75px; }
  .kid .button.b3 { top: 95px; }

  /* ===== 胳膊 ===== */
  .kid .arm {
    position: absolute;
    width: 22px;
    height: 75px;
    border: 3px solid #2d2418;
    border-radius: 12px;
    top: 5px;
    z-index: 1;
    transform-origin: top center;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .kid.boy .arm { background: linear-gradient(180deg, #6ab7ff, #3a7bd5); }
  .kid.girl .arm { background: linear-gradient(180deg, #ff9eb5, #ee5276); }
  .kid .arm.l { left: -5px; transform: rotate(8deg); }
  .kid .arm.r { right: -5px; transform: rotate(-8deg); }
  /* 手 */
  .kid .arm::after {
    content: "";
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 22px;
    background: #fdc795;
    border: 3px solid #3d2817;
    border-radius: 50%;
  }
  /* 说话时挥手姿势 */
  .kid.speaking.left .arm.r {
    transform: rotate(-50deg);
    animation: waveR 0.8s ease infinite alternate;
  }
  .kid.speaking.right .arm.l {
    transform: rotate(50deg);
    animation: waveL 0.8s ease infinite alternate;
  }
  @keyframes waveR {
    from { transform: rotate(-40deg); }
    to { transform: rotate(-65deg); }
  }
  @keyframes waveL {
    from { transform: rotate(40deg); }
    to { transform: rotate(65deg); }
  }

  /* ===== 裤子/裙子 ===== */
  .kid .pants {
    position: relative;
    width: 110px;
    height: 30px;
    margin: -3px auto 0;
    border: 3px solid #2d2418;
    z-index: 1;
  }
  .kid.boy .pants {
    background: linear-gradient(180deg, #34495e, #2c3e50);
    border-radius: 0 0 8px 8px;
  }
  /* 女孩 A 字裙：上窄下宽，居中对齐 */
  .kid.girl .pants {
    width: 140px;
    height: 50px;
    margin: -3px auto 0;
    background: linear-gradient(180deg, #ee5276 0%, #c0392b 100%);
    border: 3px solid #2d2418;
    border-radius: 4px 4px 8px 8px;
    clip-path: polygon(11% 0, 89% 0, 100% 100%, 0 100%);
  }
  /* 裙子上的褶皱装饰 */
  .kid.girl .pants::before {
    content: "";
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 2px;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
  }
  .kid.girl .pants::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.2));
  }
  /* 鞋子 */
  .kid .shoes {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 4px;
  }
  .kid .shoe {
    width: 28px;
    height: 14px;
    background: linear-gradient(180deg, #fff 40%, #2d2418 40%);
    border: 2px solid #2d2418;
    border-radius: 10px 10px 4px 4px;
  }
  /* 女孩穿小皮鞋 + 白袜子 */
  .kid.girl .shoe {
    background: linear-gradient(180deg, #fff 35%, #c0392b 35%);
  }

  /* ========== 对话气泡 ========== */
  .bubble {
    position: absolute;
    background: #fff;
    padding: 14px 20px;
    border-radius: 20px;
    border: 3px solid #2d3436;
    max-width: 280px;
    font-size: 16px;
    line-height: 1.6;
    color: #2d3436;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 0.4s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    z-index: 20;
  }
  .bubble.show {
    opacity: 1;
    transform: scale(1);
  }
  .bubble.left {
    bottom: 32%;
    left: 22%;
  }
  .bubble.left::after {
    content: "";
    position: absolute;
    bottom: -18px;

  .bubble.left::before {
    content: "";
    position: absolute;

  }
  .bubble.right::after {
    content: "";
    position: absolute;

  }

  }

  /* 思考小图标在头顶 */
  .think-icon {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    font-size: 36px;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 6;
  }
  .think-icon.show {
    transform: translateX(-50%) scale(1);
    animation: floatIcon 1.5s ease infinite;
  }
  @keyframes floatIcon {
    0%, 100% { transform: translateX(-50%) scale(1) translateY(0); }
    50% { transform: translateX(-50%) scale(1.1) translateY(-6px); }
  }

  /* ========== 标题条 ========== */
  .title-bar {
    position: absolute;
    top: 0;
    left: 0; right: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.7));
    padding: 8px 20px;
    text-align: center;
    font-size: 14px;

  }
  .title-bar strong {
    color: #ee5253;
    margin-right: 8px;
  }

  /* ========== 控制按钮 ========== */
  .controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    background: rgba(255,255,255,0.9);
    padding: 8px;
    border-radius: 30px;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    z-index: 100;
  }
  .controls button {
    background: transparent;
    border: none;
    padding: 8px 18px;
    border-radius: 22px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    font-weight: bold;
    color: #2d3436;
    transition: all 0.2s;
  }
  .controls button:hover { background: rgba(0,0,0,0.08); }
  .controls button.primary {
    background: linear-gradient(135deg, #ff6b6b, #ee5253);
    color: #fff;
  }

  /* 进度指示 */
  .step-indicator {
    position: fixed;
    top: 50px;
    right: 20px;
    background: rgba(255,255,255,0.9);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    color: #2d3436;
    z-index: 50;
    backdrop-filter: blur(8px);
  }

  /* 撒花特效 */
  .confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    opacity: 0;
    z-index: 100;
  }
  .show-confetti .confetti {
    animation: confettiFall 2.5s ease-out forwards;
  }
  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(-100px) rotate(0); }
    100% { opacity: 0; transform: translateY(500px) rotate(720deg); }
  }
</style>
</head>
<body>
  <div class="classroom" id="classroom">

  </div>

  <div class="step-indicator" id="indicator">第 1 / 10 段</div>

  <div class="controls">
    <button onclick="prev()">‹ 上一段</button>
    <button class="primary" onclick="restart()">⟳ 重新播放</button>
    <button onclick="next()">下一段 ›</button>
  </div>

<script>
  // 对话脚本：[谁说, 内容, 思考图标(可选), 黑板高亮(可选)]
  const dialog = [
    ['boy',  '🥺 端午节快到了，奶奶让我帮她在网上买点粽子...可商品那么多，我都不知道挑哪个！', '💭', null],
    ['girl', '🤓 别担心！我们上节课老师教的方法不是全用上嘛！', null, null],
    ['boy',  '🤔 对哦！老师说的第一招是......分类查看？', null, 0],
    ['girl', '✅ 没错！先在 app 里选"食品 → 粽子"分类，一下就把别的东西过滤掉啦', '💡', 0],
    ['boy',  '😆 我懂了！然后再按销量排，大家都买的肯定不会差到哪去', null, 1],
    ['girl', '👍 聪明！销量高说明很多人都觉得好吃，奶奶肯定也会喜欢的', null, 1],
    ['boy',  '💰 那价钱呢？奶奶说不要太贵的...', null, 2],
    ['girl', '😊 那就按价钱从低到高排，挑性价比合适的，奶奶就开心啦', null, 2],
    ['boy',  '🌟 最后再看看买家评价对吧？要看真实的反馈！', null, 3],
    ['girl', '🎉 完全正确！四招用完，保证挑到奶奶满意的粽子～加油！', '💡', 3]
  ];

  const kidLeft = document.getElementById('kid-left');
  const kidRight = document.getElementById('kid-right');
  const bubbleLeft = document.getElementById('bubble-left');
  const bubbleRight = document.getElementById('bubble-right');
  const thinkLeft = document.getElementById('think-left');
  const thinkRight = document.getElementById('think-right');
  const indicator = document.getElementById('indicator');
  const classroom = document.getElementById('classroom');

  let current = 0;
  let timer = null;
  let autoPlay = true;

  function clearScene() {
    kidLeft.classList.remove('speaking');
    kidRight.classList.remove('speaking');
    bubbleLeft.classList.remove('show');
    bubbleRight.classList.remove('show');
    thinkLeft.classList.remove('show');
    thinkRight.classList.remove('show');
  }

  function showStep(idx) {
    clearTimeout(timer);
    clearScene();

    if (idx >= dialog.length) {
      // 全部讲完，撒花庆祝再循环
      celebrate();
      timer = setTimeout(() => {
        // 黑板擦掉重来
        for (let i = 0; i < 4; i++) {
          document.getElementById('chalk-' + i).classList.remove('show');
        }
        current = 0;
        showStep(0);
      }, 4000);
      return;
    }

    current = idx;
    const [who, text, think, chalk] = dialog[idx];

    indicator.textContent = `第 ${idx + 1} / ${dialog.length} 段`;

    if (who === 'boy') {
      kidLeft.classList.add('speaking');
      bubbleLeft.innerHTML = text;
      setTimeout(() => bubbleLeft.classList.add('show'), 50);
      if (think) {
        setTimeout(() => thinkLeft.classList.add('show'), 200);
      }
    } else {
      kidRight.classList.add('speaking');
      bubbleRight.innerHTML = text;
      setTimeout(() => bubbleRight.classList.add('show'), 50);
      if (think) {
        setTimeout(() => thinkRight.classList.add('show'), 200);
      }
    }

    // 高亮对应的黑板条目
    if (chalk !== null) {
      setTimeout(() => {
        document.getElementById('chalk-' + chalk).classList.add('show');
      }, 600);
    }

    // 计算这段话的展示时长（按字数）
    const duration = Math.max(3500, text.length * 180);
    if (autoPlay) {
      timer = setTimeout(() => showStep(idx + 1), duration);
    }
  }

  function celebrate() {
    // 撒花
    const colors = ['#ff6b6b', '#74b9ff', '#ffd700', '#55efc4', '#a29bfe', '#fdcb6e'];
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = colors[i % colors.length];
      c.style.left = Math.random() * 100 + '%';
      c.style.top = '-20px';
      c.style.animationDelay = (Math.random() * 0.8) + 's';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      classroom.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }
    classroom.classList.add('show-confetti');
    setTimeout(() => classroom.classList.remove('show-confetti'), 3000);

    // 两个孩子一起笑
    kidLeft.classList.add('speaking');
    kidRight.classList.add('speaking');
    bubbleLeft.innerHTML = '🎊 学会啦！';
    bubbleRight.innerHTML = '🎊 一起加油～';
    bubbleLeft.classList.add('show');
    bubbleRight.classList.add('show');
  }

  function next() {
    autoPlay = false;
    showStep(Math.min(current + 1, dialog.length - 1));
  }

  function prev() {
    autoPlay = false;
    showStep(Math.max(current - 1, 0));
  }

  function restart() {
    autoPlay = true;
    for (let i = 0; i < 4; i++) {
      document.getElementById('chalk-' + i).classList.remove('show');
    }
    showStep(0);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === ' ') { e.preventDefault(); restart(); }
  });

  // 启动
  showStep(0);
</script>
</body>
</html>
